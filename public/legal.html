<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SahayakAI | Legal Guidance</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="brand-inline sidebar-brand">
          <div class="brand-mark">S</div>
          <div>
            <div class="brand-name">SAHAYAKAI</div>
          </div>
        </div>
        <nav class="side-nav">
          <a class="nav-item" href="dashboard.html">🏠 Home</a>
          <a class="nav-item" href="chat.html">💬 AI Chat</a>
          <a class="nav-item" href="voice.html">🎤 Voice Assessment</a>
          <a class="nav-item" href="k10.html">🧠 K10 Assessment</a>
          <a class="nav-item active" href="legal.html">⚖ Legal Guidance</a>
          <a class="nav-item" href="history.html">📜 History</a>
          <a class="nav-item" href="help.html">📞 Helplines</a>
          <a class="nav-item" href="about.html">ℹ About SahayakAI</a>
        </nav>
      </aside>

      <main class="dashboard-main">
        <header class="top-header dashboard-header">
          <div>
            <small>Legal Guidance</small>
            <h2>Possible legal frameworks</h2>
          </div>
          <a class="secondary-btn" href="dashboard.html">Back to dashboard</a>
        </header>

        <section class="content-wrap">
          <div id="legal-results" class="legal-results"></div>
        </section>
      </main>
    </div>

    <div id="status-toast" class="toast hidden"></div>
    <script src="shared.js"></script>
    <script>
      requireAuth();
      const query = 'Threats and intimidation';
      fetch(`/api/legal?text=${encodeURIComponent(query)}&category=${encodeURIComponent(getSelectedCategory())}`)
        .then((res) => res.json())
        .then((data) => {
          const results = document.getElementById('legal-results');
          results.innerHTML = (data.frameworks || []).map((item) => `
            <article class="info-box">
              <h3>${item.law}</h3>
              <p><strong>Why it may be relevant:</strong> ${item.relevance}</p>
              <p><strong>What the user can consider doing:</strong> ${item.action}</p>
              <p><strong>Official source:</strong> ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.source}</a>` : item.source}</p>
              <p><strong>Disclaimer:</strong> ${item.disclaimer}</p>
            </article>
          `).join('');
        });
    </script>
  </body>
</html>
