<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SahayakAI | Help & Emergency</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="brand-inline sidebar-brand">
          <div class="brand-mark">S</div>
          <div>
            <div class="brand-name">SAHAYAKAI</div>
          </div>
        </div>
        <nav class="side-nav">
          <a class="nav-item" href="dashboard.html">🏠 Home</a>
          <a class="nav-item" href="chat.html">💬 AI Chat</a>
          <a class="nav-item" href="voice.html">🎤 Voice Assessment</a>
          <a class="nav-item" href="k10.html">🧠 K10 Assessment</a>
          <a class="nav-item" href="legal.html">⚖ Legal Guidance</a>
          <a class="nav-item" href="history.html">📜 History</a>
          <a class="nav-item active" href="help.html">📞 Helplines</a>
          <a class="nav-item" href="about.html">ℹ About SahayakAI</a>
        </nav>
      </aside>

      <main class="dashboard-main">
        <header class="top-header dashboard-header">
          <div>
            <small>Help&Emergency</small>
            <h2>Support and helpline resources</h2>
          </div>
          <a class="secondary-btn" href="dashboard.html">Back to dashboard</a>
        </header>

        <section class="content-wrap">
          <div id="helpline-content" class="helpline-box"></div>
        </section>
      </main>
    </div>

    <div id="status-toast" class="toast hidden"></div>
    <script src="shared.js"></script>
    <script>
      requireAuth();
      fetch('/api/helplines')
        .then((res) => res.json())
        .then((result) => {
          const resource = result.resource || {};
          const emergency = result.emergency || [];
          document.getElementById('helpline-content').innerHTML = `
            <div class="info-box danger-box">
              <h3>${resource.name}</h3>
              <p><strong>Shortcode:</strong> ${resource.phone}</p>
              <p><strong>Alternate:</strong> ${resource.alternate}</p>
              <p><strong>Website:</strong> <a href="${resource.website}" target="_blank" rel="noreferrer">${resource.website}</a></p>
              <div class="voice-controls">
                <a class="primary-btn" href="tel:${resource.phone}">Call NHAA</a>
                <a class="secondary-btn" href="${resource.website}" target="_blank" rel="noreferrer">Visit the official NHAA website</a>
              </div>
            </div>

            <div class="info-box">
              <h3>Emergency and support</h3>
              ${emergency.map((item) => `<p><strong>${item.name}:</strong> ${item.value}</p>`).join('')}
            </div>
          `;
        });
    </script>
  </body>
</html>
